name: Continuous Deployment — Staging Only

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing GHCR image tag or immutable SHA to deploy to staging'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ruview-staging-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: wifi-densepose-staging
  K8S_DEPLOYMENT: wifi-densepose

jobs:
  validate:
    name: Validate staging deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Resolve requested image
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAG"
          case "$IMAGE_TAG" in
            *[!A-Za-z0-9._-]*)
              echo "invalid image_tag" >&2
              exit 2
              ;;
          esac
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker manifest inspect "$image" >/dev/null
          echo "ref=$image" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy exact image to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    environment:
      name: staging
      url: https://staging.wifi-densepose.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'v1.28.0'

      - name: Configure staging kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA_STAGING }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_DATA"
          umask 077
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
          echo "KUBECONFIG=${GITHUB_WORKSPACE}/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy requested image
        env:
          IMAGE_REF: ${{ needs.validate.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl set image deployment/${K8S_DEPLOYMENT} \
            wifi-densepose="$IMAGE_REF" \
            -n ${K8S_NAMESPACE}
          kubectl rollout status deployment/${K8S_DEPLOYMENT} \
            -n ${K8S_NAMESPACE} \
            --timeout=600s

      - name: Staging smoke tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error https://staging.wifi-densepose.com/health >/dev/null
          curl --fail-with-body --silent --show-error https://staging.wifi-densepose.com/api/v1/info >/dev/null

      - name: Staging integration tests
        run: python -m pytest tests/integration/ --base-url=https://staging.wifi-densepose.com -v

      - name: Remove kubeconfig
        if: always()
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE}/kubeconfig"

  production-quarantined:
    name: Production deployment is quarantined
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain hard stop
        run: |
          cat <<'EOF'
          Production deployment is intentionally disabled.

          Re-enable only after all of the following exist and are independently reviewed:
          - approved encrypted private backup destination;
          - tested restore procedure and non-sensitive backup receipt;
          - production environment reviewer policy;
          - exact source/image identity contract;
          - no raw DB dump, kubeconfig or classified data in GitHub artifacts/caches/logs;
          - exact-head deployment/rollback tests;
          - GitHub Fortress bypass identity and rollback proof.
          EOF
